<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" lang="vi">
  <title>So sánh Flexbox 1 chiều và CSS Grid 2 chiều cùng mẹo Flexbox Froggy và Grid Garden</title>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Nen tong the -->
  <rect x="0" y="0" width="1120" height="660" fill="#F8FAFC"/>

  <!-- Tieu de -->
  <text x="36" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Flexbox (1 chiều) và CSS Grid (2 chiều): Khi nào dùng loại nào?</text>
  <text x="36" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Flexbox xếp gọn các khối theo 1 đường thẳng; CSS Grid chia khung lưới cả hàng lẫn cột cùng lúc</text>
  <rect x="896" y="24" width="188" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="990" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#4338CA">PHẦN 4 | CHIA BỐ CỤC</text>
  <line x1="36" y1="82" x2="1084" y2="82" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- COT TRAI: FLEXBOX -->
  <rect x="36" y="96" width="514" height="540" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="58" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">1. Flexbox: Xếp 1 chiều (1 hàng hoặc 1 cột)</text>
  <text x="58" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">Dùng cho thanh Menu, hàng nút và căn đều theo 1 đường thẳng</text>

  <!-- Khung minh hoa truc Flexbox -->
  <rect x="58" y="162" width="470" height="234" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Truc chinh (nam ngang, chu nam phia tren mui ten) -->
  <text x="354" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D4ED8">Trục chính (justify-content) — hướng ngang</text>
  <line x1="196" y1="202" x2="508" y2="202" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Truc phu (nam doc ben trai, chu tach han ve ben trai mui ten) -->
  <text x="116" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6D28D9">Trục phụ</text>
  <text x="116" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#6D28D9">align-items</text>
  <text x="116" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">(căn dọc)</text>
  <line x1="178" y1="224" x2="178" y2="332" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-violet)"/>

  <!-- Hop Flex chua 3 khoi Logo / Menu / Nut -->
  <rect x="196" y="220" width="316" height="114" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="5 3"/>
  <rect x="212" y="248" width="76" height="58" rx="7" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="250" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">Logo</text>

  <rect x="306" y="238" width="96" height="78" rx="7" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="354" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4C1D95">Menu</text>

  <rect x="420" y="252" width="76" height="50" rx="7" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="458" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">Nút</text>

  <!-- Chu thich duoi khung Flex -->
  <text x="293" y="360" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1E3A8A">justify-content: space-between; align-items: center;</text>
  <text x="293" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Đổi sang column: 2 trục tự hoán đổi hướng cho nhau</text>

  <!-- Hop code Flexbox -->
  <rect x="58" y="410" width="470" height="106" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="76" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">Mẹo hay dùng: đẩy nút đáy nhiều thẻ thẳng hàng nhau</text>
  <text x="76" y="457" font-family="Consolas, monospace" font-size="11.5" fill="#1E293B">.card { display: flex; flex-direction: column; }</text>
  <text x="76" y="479" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#2563EB">.card .btn { margin-top: auto; }</text>
  <text x="76" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">Khoảng trống thừa được dồn hết lên trên nút bấm</text>

  <!-- Meo game Flexbox Froggy -->
  <rect x="58" y="528" width="470" height="90" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="76" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">Mẹo luyện game Flexbox Froggy (24 màn):</text>
  <text x="76" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#047857">1. Xem hướng Trục chính trước (hàng row hay cột column).</text>
  <text x="76" y="597" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#047857">2. Dùng justify-content (chính) và align-items (phụ).</text>

  <!-- COT PHAI: CSS GRID -->
  <rect x="570" y="96" width="514" height="540" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="592" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4C1D95">2. CSS Grid: Chia lưới 2 chiều (cả hàng lẫn cột)</text>
  <text x="592" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Phù hợp cho bố cục Bento tổng thể và danh sách thẻ tự co số cột</text>

  <!-- Khung minh hoa luoi 3 cot -->
  <rect x="592" y="162" width="470" height="234" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Nhan 3 cot phia tren -->
  <text x="678" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Cột 1 (1fr)</text>
  <text x="827" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Cột 2 (1fr)</text>
  <text x="976" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Cột 3 (1fr)</text>

  <!-- O gop 2 cot (span 2) -->
  <rect x="612" y="196" width="281" height="74" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="752" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4C1D95">Ô lớn gộp 2 cột</text>
  <text x="752" y="249" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#6D28D9">grid-column: span 2;</text>

  <!-- Cot ben gop 2 hang (span 2) -->
  <rect x="910" y="196" width="132" height="162" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="976" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400E">Cột bên gộp</text>
  <text x="976" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400E">2 hàng</text>
  <text x="976" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#B45309">grid-row:</text>
  <text x="976" y="319" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#B45309">span 2;</text>

  <!-- 2 o thuong ben duoi -->
  <rect x="612" y="284" width="132" height="74" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="678" y="317" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Thẻ số 1</text>
  <text x="678" y="336" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">1 ô lưới</text>

  <rect x="761" y="284" width="132" height="74" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="827" y="317" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Thẻ số 2</text>
  <text x="827" y="336" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">1 ô lưới</text>

  <!-- Chu thich duoi luoi -->
  <text x="827" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#4C1D95">grid-template-columns: repeat(3, 1fr); gap: 1rem;</text>

  <!-- Cong thuc tu co cot -->
  <rect x="592" y="410" width="470" height="106" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="610" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">Công thức tự co cột không cần @media:</text>
  <text x="610" y="456" font-family="Consolas, monospace" font-size="11.5" fill="#4C1D95">grid-template-columns:</text>
  <text x="610" y="476" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#4F46E5">  repeat(auto-fit, minmax(min(280px, 100%), 1fr));</text>
  <text x="610" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">Tự chia 3 cột -&gt; 2 cột -&gt; 1 cột khi thu nhỏ màn hình</text>

  <!-- Meo game Grid Garden -->
  <rect x="592" y="528" width="470" height="90" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="610" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">Mẹo luyện game Grid Garden (28 màn):</text>
  <text x="610" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#047857">1. Đếm tọa độ theo đường kẻ lưới (Grid Lines) bắt đầu từ 1.</text>
  <text x="610" y="597" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#047857">2. Dùng span (ví dụ: 1 / span 2) và đơn vị chia tỷ lệ fr.</text>
</svg>
