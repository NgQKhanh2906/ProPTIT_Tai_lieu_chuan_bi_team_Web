  <rect x="418" y="548" width="130" height="14" rx="3" fill="#4F46E5"/>

  <text x="76" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#047857">Không tràn ngang từ 375px đến 1280px | Nút chạm cao tối thiểu 44px</text>

  <!-- COT PHAI: QUY TRINH 4 BUOC DEPLOY -->
  <rect x="624" y="96" width="460" height="530" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="646" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">B. Quy trình 4 bước đưa web lên mạng (Deploy)</text>
  <text x="646" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">Kiểm tra trước khi xuất bản thành link HTTPS công khai</text>

  <!-- Buoc 1 -->
  <rect x="646" y="164" width="416" height="94" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="674" cy="196" r="14" fill="#2563EB"/>
  <text x="674" y="201" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="700" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">Kiểm tra Bàn phím + Lighthouse &gt;= 90</text>
  <text x="700" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Thử đi hết trang bằng Tab / Enter / Space</text>
  <text x="700" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Đo Lighthouse A11y &gt;= 90 ở tab Ẩn danh</text>

  <line x1="854" y1="258" x2="854" y2="275" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr-indigo)"/>

  <!-- Buoc 2 -->
  <rect x="646" y="278" width="416" height="94" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <circle cx="674" cy="310" r="14" fill="#7C3AED"/>
  <text x="674" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="700" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4C1D95">Đẩy mã nguồn lên GitHub</text>
  <text x="700" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Đặt index.html và styles.css ở thư mục gốc</text>
  <text x="700" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Chạy git commit rồi push lên nhánh main</text>

  <line x1="854" y1="372" x2="854" y2="389" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr-indigo)"/>

  <!-- Buoc 3 -->
  <rect x="646" y="392" width="416" height="94" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <circle cx="674" cy="424" r="14" fill="#D97706"/>
  <text x="674" y="429" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="700" y="421" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400E">Bật GitHub Pages hoặc kéo thả Netlify</text>
  <text x="700" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- GitHub: Settings -&gt; Pages -&gt; nhánh main</text>
  <text x="700" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Hoặc kéo thả thư mục vào netlify.com/drop</text>

  <line x1="854" y1="486" x2="854" y2="503" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

