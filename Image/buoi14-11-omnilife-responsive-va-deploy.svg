  <rect x="646" y="506" width="416" height="98" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.8"/>
  <circle cx="674" cy="538" r="14" fill="#059669"/>
  <text x="674" y="543" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <text x="700" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">Nhận đường link HTTPS công khai</text>
  <text x="700" y="558" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Mở thử link trên điện thoại &amp; gửi nộp bài</text>
  <text x="700" y="580" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#047857">https://ten-ban.github.io/omnilife/</text>
