  <text x="36" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Mục tiêu đầu ra Buổi 14: bố cục mượt từ 375px đến 1280px, Trợ năng &gt;= 90 và xuất bản link công khai</text>
  <rect x="880" y="24" width="204" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
