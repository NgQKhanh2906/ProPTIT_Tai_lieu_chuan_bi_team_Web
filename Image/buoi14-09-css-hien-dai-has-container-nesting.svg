<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" width="1120" height="610" role="img" lang="vi">
  <title>Ba tính năng CSS hiện đại: :has(), @container và CSS Nesting</title>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Nen tong the -->
  <rect x="0" y="0" width="1120" height="610" fill="#F8FAFC"/>

  <!-- Tieu de -->
  <text x="36" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">3 Tính năng CSS Hiện đại: :has(), @container và CSS Nesting</text>
  <text x="36" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Những công cụ CSS mới giúp xử lý giao diện gọn nhẹ, không cần JavaScript phức tạp hay công cụ ngoài</text>
  <rect x="880" y="24" width="204" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="982" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#4338CA">PHẦN 4 | CSS HIỆN ĐẠI</text>
  <line x1="36" y1="82" x2="1084" y2="82" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- THE 1: :has() -->
  <rect x="36" y="98" width="336" height="488" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="36" y="98" width="336" height="64" rx="12" fill="#EFF6FF"/>
  <rect x="36" y="148" width="336" height="14" fill="#EFF6FF"/>
  <line x1="36" y1="162" x2="372" y2="162" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="56" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1E3A8A">1. :has() — Chọn ngược thẻ cha</text>
  <text x="56" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#2563EB">Đổi giao diện cha khi ô con được tích</text>

  <!-- Minh hoa the 1 -->
  <rect x="56" y="178" width="296" height="218" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Trang thai chua tich -->
  <rect x="72" y="192" width="264" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="88" y="213" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/>
  <text x="120" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Ôn tập bài CSS Grid</text>
  <text x="120" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">Chưa tích: khung cha bình thường</text>

  <!-- Mui ten xuong -->
  <line x1="98" y1="258" x2="98" y2="290" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="116" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1D4ED8">Người dùng tích ô (:checked)</text>

  <!-- Trang thai da tich (cha tu doi mau) -->
  <rect x="72" y="296" width="264" height="84" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <rect x="88" y="314" width="20" height="20" rx="4" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
  <polyline points="92,324 96,329 104,319" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#065F46">Ôn tập bài CSS Grid</text>
  <line x1="120" y1="324" x2="236" y2="324" stroke="#065F46" stroke-width="1.5"/>
  <text x="120" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#047857">Thẻ cha .task-item tự đổi nền</text>
  <text x="120" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#047857">và gạch ngang chữ không cần JS</text>

  <!-- Code box the 1 -->
  <rect x="56" y="410" width="296" height="112" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="72" y="432" font-family="Consolas, monospace" font-size="11" fill="#64748B">/* Cha có con đang :checked */</text>
  <text x="72" y="454" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1D4ED8">.task-item:has(:checked) {</text>
  <text x="72" y="474" font-family="Consolas, monospace" font-size="11.5" fill="#0F172A">  opacity: 0.65;</text>
  <text x="72" y="494" font-family="Consolas, monospace" font-size="11.5" fill="#0F172A">  background: #ECFDF5;</text>
  <text x="72" y="512" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1D4ED8">}</text>

  <rect x="56" y="534" width="296" height="36" rx="6" fill="#EFF6FF"/>
  <text x="204" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E3A8A">Không cần viết sự kiện JavaScript</text>

  <!-- THE 2: @container -->
  <rect x="392" y="98" width="336" height="488" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="392" y="98" width="336" height="64" rx="12" fill="#F5F3FF"/>
  <rect x="392" y="148" width="336" height="14" fill="#F5F3FF"/>
  <line x1="392" y1="162" x2="728" y2="162" stroke="#DDD6FE" stroke-width="1.2"/>
  <text x="412" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#4C1D95">2. @container — Hỏi hộp chứa</text>
  <text x="412" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6D28D9">Thẻ tự xếp dọc/ngang theo độ rộng hộp</text>

  <!-- Minh hoa the 2 -->
  <rect x="412" y="178" width="296" height="218" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Hop chua hep -->
  <rect x="426" y="192" width="118" height="190" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="485" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#6D28D9">Hộp hẹp (&lt; 420)</text>
  <rect x="438" y="220" width="94" height="122" rx="6" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <rect x="448" y="230" width="74" height="44" rx="4" fill="#DDD6FE"/>
  <rect x="448" y="284" width="74" height="10" rx="3" fill="#8B5CF6"/>
  <rect x="448" y="302" width="52" height="10" rx="3" fill="#C4B5FD"/>
  <text x="485" y="366" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#4C1D95">Xếp dọc</text>

  <!-- Hop chua rong -->
  <rect x="556" y="192" width="138" height="190" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="625" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#047857">Hộp rộng (&gt;= 420)</text>
  <rect x="564" y="236" width="122" height="86" rx="6" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
  <rect x="572" y="248" width="44" height="62" rx="4" fill="#A7F3D0"/>
  <rect x="624" y="254" width="54" height="10" rx="3" fill="#10B981"/>
  <rect x="624" y="272" width="46" height="10" rx="3" fill="#6EE7B7"/>
  <rect x="624" y="290" width="38" height="10" rx="3" fill="#6EE7B7"/>
  <text x="625" y="366" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#065F46">Tự xếp ngang</text>

  <!-- Code box the 2 -->
  <rect x="412" y="410" width="296" height="112" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="428" y="432" font-family="Consolas, monospace" font-size="11" fill="#6D28D9">.box { container-type: inline-size; }</text>
  <text x="428" y="458" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#4C1D95">@container (min-width: 420px) {</text>
  <text x="428" y="478" font-family="Consolas, monospace" font-size="11.5" fill="#0F172A">  .card { flex-direction: row; }</text>
  <text x="428" y="498" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#4C1D95">}</text>

  <rect x="412" y="534" width="296" height="36" rx="6" fill="#F5F3FF"/>
  <text x="560" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">Đặt thẻ ở Sidebar hay Main đều tự vừa</text>

  <!-- THE 3: CSS NESTING & -->
  <rect x="748" y="98" width="336" height="488" rx="12" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <rect x="748" y="98" width="336" height="64" rx="12" fill="#ECFDF5"/>
  <rect x="748" y="148" width="336" height="14" fill="#ECFDF5"/>
  <line x1="748" y1="162" x2="1084" y2="162" stroke="#A7F3D0" stroke-width="1.2"/>
  <text x="768" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065F46">3. CSS Nesting — Viết lồng &amp;</text>
  <text x="768" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#059669">Viết lồng gọn nhẹ ngay trong CSS thuần</text>

  <!-- Minh hoa the 3 -->
  <rect x="768" y="178" width="296" height="218" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Cach cu -->
  <rect x="780" y="192" width="272" height="86" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="794" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">Cách cũ (phải lặp lại .btn):</text>
  <text x="794" y="232" font-family="Consolas, monospace" font-size="10.5" fill="#334155">.btn { background: #4F46E5; }</text>
  <text x="794" y="250" font-family="Consolas, monospace" font-size="10.5" fill="#DC2626">.btn:hover { background: #4338CA; }</text>
  <text x="794" y="268" font-family="Consolas, monospace" font-size="10.5" fill="#DC2626">.btn .icon { color: #FFF; }</text>

  <!-- Cach moi dung & -->
  <rect x="780" y="290" width="272" height="94" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.8"/>
  <text x="794" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065F46">Cách mới dùng &amp; (gom 1 khối):</text>
  <text x="794" y="330" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#047857">.btn {</text>
  <text x="794" y="347" font-family="Consolas, monospace" font-size="10.5" fill="#0F172A">  &amp;:hover { background: #4338CA; }</text>
  <text x="794" y="364" font-family="Consolas, monospace" font-size="10.5" fill="#0F172A">  &amp; .icon { color: #FFF; }</text>
  <text x="794" y="378" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#047857">}</text>

  <!-- Giai thich the 3 -->
  <rect x="768" y="410" width="296" height="112" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="784" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Dấu &amp; đại diện cho thẻ cha (.btn)</text>
  <text x="784" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Gom mọi trạng thái :hover vào 1 chỗ</text>
  <text x="784" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Dễ đọc, dễ sửa khi file CSS dài</text>
  <text x="784" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">- Trình duyệt hỗ trợ sẵn từ 2023</text>

  <rect x="768" y="534" width="296" height="36" rx="6" fill="#ECFDF5"/>
  <text x="916" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065F46">Không cần cài công cụ ngoài (Sass)</text>
</svg>
