<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="as-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker><marker id="as-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker></defs>
<rect x="0" y="0" width="960" height="700" fill="#FFFFFF"/>
<text x="24" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238">Một request có token đi qua Spring Security như thế nào</text>
<line x1="24" y1="44" x2="936" y2="44" stroke="#CFD8DC" stroke-width="1"/>
<rect x="220" y="62" width="220" height="52" rx="10" fill="#FFFFFF" stroke="#78909C" stroke-width="1.6"/>
<text x="330.0" y="82.89399999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Request tới API</text>
<text x="330.0" y="101.24799999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">ví dụ GET /api/tours</text>
<polygon points="330,132.0 475.0,182 330,232.0 185.0,182" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.6"/>
<text x="330" y="177.08599999999998" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A148C" text-anchor="middle">Có header</text>
<text x="330" y="194.636" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A148C" text-anchor="middle">Authorization: Bearer ...?</text>
<polygon points="330,276.0 475.0,326 330,376.0 185.0,326" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.6"/>
<text x="330" y="321.086" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A148C" text-anchor="middle">Token hợp lệ?</text>
<text x="330" y="338.636" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A148C" text-anchor="middle">đúng chữ ký, chưa hết hạn</text>
<rect x="190" y="404" width="280" height="56" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
<text x="330.0" y="426.894" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D47A1" text-anchor="middle">Đặt Authentication</text>
<text x="330.0" y="445.248" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">vào SecurityContextHolder</text>
<polygon points="330,490.0 475.0,540 330,590.0 185.0,540" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
<text x="330" y="535.086" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D47A1" text-anchor="middle">Đủ quyền?</text>
<text x="330" y="552.636" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0D47A1" text-anchor="middle">theo SecurityConfig</text>
<rect x="210" y="624" width="240" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
<text x="330.0" y="646.894" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B5E20" text-anchor="middle">200: vào Controller</text>
<text x="330.0" y="665.2480000000002" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">chạy nghiệp vụ bình thường</text>
<path d="M 330,114 L 330,130" fill="none" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah-neutral)"/>
<path d="M 330,232 L 330,274" fill="none" stroke="#7B1FA2" stroke-width="1.8" marker-end="url(#ah-purple)"/>
<text x="346" y="258.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A148C" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Có</text>
<path d="M 330,376 L 330,402" fill="none" stroke="#7B1FA2" stroke-width="1.8" marker-end="url(#ah-purple)"/>
<text x="346" y="394.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A148C" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Có</text>
<path d="M 330,460 L 330,488" fill="none" stroke="#1565C0" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<path d="M 330,590 L 330,622" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ah-green)"/>
<text x="346" y="612.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B5E20" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Có</text>
<text x="24" y="140" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4A148C" text-anchor="start">JwtAuthenticationFilter</text>
<text x="24" y="158" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">bước 1 và 2</text>
<text x="24" y="500" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D47A1" text-anchor="start">AuthorizationFilter</text>
<text x="24" y="518" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">bước 3</text>
<rect x="590" y="150" width="346" height="64" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.6"/>
<text x="763.0" y="177.584" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#BF360C" text-anchor="middle">401 Chưa xác thực</text>
<text x="763.0" y="194.972" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">{"status": 401, "message": "Chua xac thuc"}</text>
<rect x="590" y="294" width="346" height="64" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.6"/>
<text x="763.0" y="321.584" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#BF360C" text-anchor="middle">401 Token sai hoặc hết hạn</text>
<text x="763.0" y="338.972" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">"Token khong hop le" / "Token da het han"</text>
<rect x="590" y="504" width="346" height="72" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.6"/>
<text x="763.0" y="527.304" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="middle">403 Không đủ quyền</text>
<text x="763.0" y="544.692" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">{"status": 403,</text>
<text x="763.0" y="561.252" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle"> "message": "Khong co quyen truy cap"}</text>
<path d="M 475,182 L 588,182" fill="none" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#ah-orange)"/>
<text x="530" y="174.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#BF360C" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Không</text>
<path d="M 475,326 L 588,326" fill="none" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#ah-orange)"/>
<text x="530" y="318.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#BF360C" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Không</text>
<path d="M 475,540 L 588,540" fill="none" stroke="#C62828" stroke-width="1.8" marker-end="url(#ah-red)"/>
<text x="530" y="532.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#B71C1C" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Không</text>
<text x="590" y="234" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">Trừ API permitAll như /api/auth/**: vẫn cho qua</text>
<text x="590" y="378" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">Trả về bởi RestAuthenticationEntryPoint</text>
<text x="590" y="596" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">Trả về bởi RestAccessDeniedHandler</text>
<text x="590" y="640" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#263238" text-anchor="start">Lưu ý: JwtAuthenticationFilter không tự trả 401.</text>
<text x="590" y="658" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#263238" text-anchor="start">Nó cho request đi tiếp mà không có Authentication,</text>
<text x="590" y="676" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#263238" text-anchor="start">AuthorizationFilter chặn lại rồi EntryPoint trả 401.</text>
</svg>
