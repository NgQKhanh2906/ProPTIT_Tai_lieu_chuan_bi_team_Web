<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="as-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker><marker id="as-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#FFFFFF"/>
<text x="24" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238">Chữ ký bảo vệ tính toàn vẹn: sửa payload là chữ ký không còn khớp</text>
<line x1="24" y1="44" x2="936" y2="44" stroke="#CFD8DC" stroke-width="1"/>
<rect x="24" y="64" width="280" height="104" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.6"/>
<text x="164.0" y="103.30399999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A148C" text-anchor="middle">1. Token gốc của An</text>
<text x="164.0" y="120.692" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">payload: "role": "USER"</text>
<text x="164.0" y="137.252" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">signature: ZYtXbgC8io75...</text>
<rect x="340" y="64" width="280" height="104" rx="10" fill="#FFFFFF" stroke="#78909C" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="480.0" y="95.02399999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">2. Kẻ gian sửa payload</text>
<text x="480.0" y="112.41199999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">"role": "USER" thành "ADMIN"</text>
<text x="480.0" y="128.972" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">giữ nguyên signature cũ</text>
<text x="480.0" y="145.532" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">(không có secret để ký lại)</text>
<rect x="656" y="64" width="280" height="104" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
<text x="796.0" y="95.02399999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D47A1" text-anchor="middle">3. Server ký lại để so sánh</text>
<text x="796.0" y="112.41199999999999" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">HMACSHA256(header.payload</text>
<text x="796.0" y="128.972" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">mới, secret)</text>
<text x="796.0" y="145.532" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle">= RQJ_iRbOyVj-...</text>
<path d="M 304,116 L 338,116" fill="none" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah-neutral)"/>
<path d="M 620,116 L 654,116" fill="none" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah-neutral)"/>
<polygon points="796,205.0 936.0,260 796,315.0 656.0,260" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
<text x="796" y="247.36399999999998" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0D47A1" text-anchor="middle">4. So khớp chữ ký?</text>
<text x="796" y="263.56399999999996" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0D47A1" text-anchor="middle">RQJ_iRbOyV... (vừa tính)</text>
<text x="796" y="279.764" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0D47A1" text-anchor="middle">ZYtXbgC8io... (trong token)</text>
<path d="M 796,168 L 796,203" fill="none" stroke="#1565C0" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<rect x="300" y="228" width="300" height="72" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.6"/>
<text x="450.0" y="258.894" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#BF360C" text-anchor="middle">Không khớp: 401</text>
<text x="450.0" y="277.248" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">"Token khong hop le"</text>
<path d="M 656,260 L 602,260" fill="none" stroke="#EF6C00" stroke-width="1.8" marker-end="url(#ah-orange)"/>
<text x="629" y="250.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#BF360C" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">khác</text>
<rect x="676" y="344" width="240" height="56" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
<text x="796.0" y="366.894" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B5E20" text-anchor="middle">Khớp: token nguyên vẹn</text>
<text x="796.0" y="385.248" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">kiểm tra tiếp exp</text>
<path d="M 796,315 L 796,342" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ah-green)"/>
<text x="784" y="334" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B5E20" text-anchor="end">chỉ khi không ai sửa token</text>
<text x="24" y="432" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="bold" fill="#263238" text-anchor="start">Ai cũng ĐỌC được payload, nhưng không ai SỬA được mà không bị phát hiện.</text>
<text x="24" y="454" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">Vì vậy không bao giờ đặt password hay dữ liệu nhạy cảm vào payload.</text>
</svg>
