8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker><marker id="as-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker></defs>
<rect x="0" y="0" width="960" height="450" fill="#FFFFFF"/>
<text x="24" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238">BCrypt: cùng mật khẩu 123456, mã hóa 2 lần ra 2 chuỗi khác nhau</text>
<line x1="24" y1="44" x2="936" y2="44" stroke="#CFD8DC" stroke-width="1"/>
<rect x="24" y="70" width="250" height="52" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.6"/>
<text x="149.0" y="90.89399999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">encode("123456")</text>
<text x="149.0" y="109.24799999999999" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">lần 1</text>
<path d="M 274,96 L 318,96" fill="none" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah-neutral)"/>
<circle cx="298" cy="96" r="11" fill="#455A64"/>
<text x="298" y="100.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="330.0" y="86" width="33.7" height="26" rx="4" fill="#ECEFF1" stroke="#78909C" stroke-width="1.2"/>
<rect x="363.7" y="86" width="25.3" height="26" rx="4" fill="#ECEFF1" stroke="#78909C" stroke-width="1.2"/>
<rect x="389.0" y="86" width="185.5" height="26" rx="4" fill="#FFF59D" stroke="#F9A825" stroke-width="1.2"/>
<rect x="574.5" y="86" width="261.3" height="26" rx="4" fill="#E0F7FA" stroke="#00838F" stroke-width="1.2"/>
<text x="330" y="104" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start">$2a$10$SJU5Hq2fvn9ZmtK5FUSYqusP68ayQodYUYVrUt/nOuLau8kykXIhq</text>
<rect x="24" y="180" width="250" height="52" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.6"/>
<text x="149.0" y="200.894" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">encode("123456")</text>
<text x="149.0" y="219.248" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">lần 2</text>
<path d="M 274,206 L 318,206" fill="none" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah-neutral)"/>
<circle cx="298" cy="206" r="11" fill="#455A64"/>
<text x="298" y="210.3" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="330.0" y="196" width="33.7" height="26" rx="4" fill="#ECEFF1" stroke="#78909C" stroke-width="1.2"/>
<rect x="363.7" y="196" width="25.3" height="26" rx="4" fill="#ECEFF1" stroke="#78909C" stroke-width="1.2"/>
<rect x="389.0" y="196" width="185.5" height="26" rx="4" fill="#FFF59D" stroke="#F9A825" stroke-width="1.2"/>
<rect x="574.5" y="196" width="261.3" height="26" rx="4" fill="#E0F7FA" stroke="#00838F" stroke-width="1.2"/>
<text x="330" y="214" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start">$2a$10$brQMQHG77/Tw9KjahXbhg.Q2CE8wN.AYKNWNjUKEvYjuH0J7X5AwG</text>
<path d="M 332.0,116 L 332.0,122 L 387.01,122 L 387.01,116" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<text x="389.01" y="140" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="end">phiên bản, cost 10</text>
<path d="M 391.01,116 L 391.01,122 L 572.47,122 L 572.47,116" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<text x="481.74" y="140" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="middle">salt ngẫu nhiên (22 ký tự)</text>
<path d="M 576.47,116 L 576.47,122 L 833.8,122 L 833.8,116" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<text x="705.135" y="140" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="middle">kết quả băm (31 ký tự)</text>
<text x="481.74" y="164" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5D4037" text-anchor="middle">Salt khác nhau ở mỗi lần encode, nên hai chuỗi hash khác nhau</text>
<text x="330" y="250" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">Cả hai chuỗi đều dài 60 ký tự và đều hợp lệ cho mật khẩu 123456</text>
<rect x="24" y="280" width="296" height="70" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
<text x="172" y="308" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">matches("123456", hash1)</text>
<text x="172" y="332" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B5E20" text-anchor="middle">true</text>
<rect x="332" y="280" width="296" height="70" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
<text x="480" y="308" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">matches("123456", hash2)</text>
<text x="480" y="332" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B5E20" text-anchor="middle">true</text>
<rect x="640" y="280" width="296" height="70" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.6"/>
<text x="788" y="308" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle">matches("1234567", hash1)</text>
<text x="788" y="332" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#BF360C" text-anchor="middle">false: đăng nhập trả 401</text>
<text x="24" y="386" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">matches() không giải mã. Nó đọc cost và salt nằm sẵn trong hash đã lưu, băm lại mật khẩu vừa nhập</text>
<text x="24" y="406" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">bằng đúng cost và salt đó, rồi so sánh với chuỗi hash đã lưu. Giống nhau thì trả true.</text>
<text x="24" y="434" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1B5E20" text-anchor="start">Mật khẩu trong bảng users luôn bắt đầu bằng $2a$10$: nhìn vào là biết đã được BCrypt mã hóa.</text>
</svg>
