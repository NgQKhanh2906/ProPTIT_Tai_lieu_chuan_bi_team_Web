<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="as-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00"/></marker><marker id="as-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF6C00"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><marker id="as-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="as-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker><marker id="as-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B1FA2"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="as-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="as-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker><marker id="as-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9A825"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#FFFFFF"/>
<text x="24" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238">Cấu trúc JWT: header.payload.signature</text>
<line x1="24" y1="44" x2="936" y2="44" stroke="#CFD8DC" stroke-width="1"/>
<rect x="24" y="60" width="912" height="112" rx="10" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.6"/>
<text x="44" y="90" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#7B1FA2" text-anchor="start">eyJhbGciOiJIUzI1NiJ9.</text>
<text x="44" y="116" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#00838F" text-anchor="start">eyJzdWIiOiJhbiIsInJvbGUiOiJVU0VSIiwiaWF0IjoxNzkyOTgzNjAwLCJleHAiOjE3OTI5ODcyMDB9.</text>
<text x="44" y="142" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#6D4C41" text-anchor="start">ZYtXbgC8io75K3Lo3t9IduMtQ7u08k9Bs11SabQI1As</text>
<text x="916" y="162" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="end">Token thật là một chuỗi liền, ở đây tách dòng tại dấu chấm</text>
<rect x="24" y="206" width="200" height="250" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.6"/>
<text x="40" y="232" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2" text-anchor="start">HEADER</text>
<text x="40" y="262" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">{</text>
<text x="40" y="284" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  "alg": "HS256"</text>
<text x="40" y="306" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">}</text>
<text x="40" y="360" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">Thuật toán ký:</text>
<text x="40" y="380" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">HMAC + SHA-256</text>
<line x1="124.0" y1="172" x2="124.0" y2="200" stroke="#7B1FA2" stroke-width="1.6" marker-end="url(#ah-purple)"/>
<rect x="240" y="206" width="400" height="250" rx="10" fill="#E0F7FA" stroke="#00838F" stroke-width="1.6"/>
<text x="256" y="232" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#00838F" text-anchor="start">PAYLOAD (claims)</text>
<text x="256" y="262" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">{</text>
<text x="256" y="284" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  "sub": "an",</text>
<text x="256" y="306" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  "role": "USER",</text>
<text x="256" y="328" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  "iat": 1792983600,</text>
<text x="256" y="350" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  "exp": 1792987200</text>
<text x="256" y="372" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">}</text>
<line x1="440.0" y1="172" x2="440.0" y2="200" stroke="#00838F" stroke-width="1.6" marker-end="url(#ah-purple)"/>
<rect x="656" y="206" width="280" height="250" rx="10" fill="#EFEBE9" stroke="#6D4C41" stroke-width="1.6"/>
<text x="672" y="232" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6D4C41" text-anchor="start">SIGNATURE</text>
<text x="672" y="262" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">HMACSHA256(</text>
<text x="672" y="284" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  base64Url(header)</text>
<text x="672" y="306" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  + "." +</text>
<text x="672" y="328" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  base64Url(payload),</text>
<text x="672" y="350" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">  secret</text>
<text x="672" y="372" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">)</text>
<line x1="796.0" y1="172" x2="796.0" y2="200" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#ah-purple)"/>
<text x="440" y="284" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#006064" text-anchor="start">username</text>
<text x="440" y="306" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#006064" text-anchor="start">claim tự thêm</text>
<text x="440" y="328" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#006064" text-anchor="start">phát hành: 10:00 26/10/2026</text>
<text x="440" y="350" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#006064" text-anchor="start">hết hạn: 11:00 (sau 1 giờ)</text>
<text x="256" y="412" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">sub, iat, exp: claim chuẩn (RFC 7519)</text>
<text x="256" y="432" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">iat, exp: số giây tính từ 01/01/1970 (UTC)</text>
<text x="672" y="412" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">Chỉ server biết secret,</text>
<text x="672" y="432" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="normal" fill="#546E7A" text-anchor="start">nên chỉ server tạo được chữ ký đúng</text>
<text x="24" y="484" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="start">Header và Payload chỉ được mã hóa Base64URL (không phải mã hóa bảo mật): dán vào jwt.io là đọc được ngay.</text>
</svg>
